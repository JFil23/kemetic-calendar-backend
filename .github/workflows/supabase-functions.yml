name: supabase-functions

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.3

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Output quality gates
        run: |
          deno check \
            supabase/functions/_shared/output_control.ts \
            supabase/functions/_shared/maat_constitution.ts \
            supabase/functions/_shared/maat_output_eval_cases.ts \
            supabase/functions/_shared/maat_output_eval_runner.ts \
            supabase/functions/_shared/maat_output_telemetry.ts \
            supabase/functions/_shared/maat_output_review.ts \
            supabase/functions/_shared/maat_output_dogfood.ts
          deno lint \
            supabase/functions/_shared/output_control.ts \
            supabase/functions/_shared/maat_constitution.ts \
            supabase/functions/_shared/maat_output_eval_cases.ts \
            supabase/functions/_shared/maat_output_eval_runner.ts \
            supabase/functions/_shared/maat_output_eval_runner_test.ts \
            supabase/functions/_shared/maat_output_telemetry.ts \
            supabase/functions/_shared/maat_output_telemetry_test.ts \
            supabase/functions/_shared/maat_output_review.ts \
            supabase/functions/_shared/maat_output_dogfood.ts \
            supabase/functions/_shared/maat_output_dogfood_test.ts
          deno test --allow-env \
            supabase/functions/_shared/output_control_test.ts \
            supabase/functions/_shared/maat_constitution_test.ts \
            supabase/functions/_shared/maat_output_eval_runner_test.ts \
            supabase/functions/_shared/maat_output_telemetry_test.ts \
            supabase/functions/_shared/maat_output_dogfood_test.ts

      - name: Test Supabase edge functions
        run: deno test --allow-env supabase/functions/

      - name: Validate fresh external calendar boundary
        run: |
          deno check supabase/functions/external_calendar/index.ts
          deno lint supabase/functions/external_calendar/

      - name: Verify backend source contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest supabase.tests.test_source_contracts

      - name: Migration smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          docker version
          supabase start
          supabase status
          supabase db reset
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/maat_delivery_ledger_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/cut14_history_containment_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/cut15_delivery_health_ledger_readers_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/cut17_cron_job_run_details_retention_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/cut18_restoration_stale_write_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/reflection_one_shot_scheduler_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/maat_output_truth_loop_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/canonical_decan_opening_truth_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/reflection_generation_manifest_v2_readers_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/maat_delivery_push_release_gate_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/reading_house_invite_delivery_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/dm_conversations_rls_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/owned_filing_page_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/planner_account_storage_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/decan_review_storage_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/external_calendar_projection_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/calendar_delete_archive_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/posted_flow_appearance_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/commons_following_public_answers_smoke.sql
          python3 supabase/dev/posted_flow_appearance_concurrency_smoke.py "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/scheduled_notification_no_token_state_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/push_token_no_token_wakeup_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/claim_scheduled_notifications_no_token_retry_window_smoke.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/dev/reflection_generation_key_smoke.sql
          bash supabase/dev/claim_scheduled_notifications_concurrency_smoke.sh "$DB_URL"
          bash supabase/dev/maat_delivery_ledger_concurrency_smoke.sh "$DB_URL"
          bash supabase/dev/cut18_restoration_stale_write_concurrency_smoke.sh "$DB_URL"
          bash supabase/dev/reflection_one_shot_claim_concurrency_smoke.sh "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
          do \$\$
          declare
            blocker_count integer;
          begin
            select count(*)::integer
              into blocker_count
            from public.maat_delivery_push_release_blockers;

            if blocker_count <> 0 then
              raise exception 'maat_delivery_push_release_blockers must be 0, got %', blocker_count;
            end if;
          end
          \$\$;
          "

      - name: Verify group DM runtime
        run: |
          supabase status -o env | deno run --allow-env --allow-net supabase/dev/group_dm_runtime_smoke.ts

      - name: Verify Inbox first-send and message actions
        run: |
          supabase status -o env | deno run --allow-env --allow-net supabase/dev/inbox_first_send_runtime_smoke.ts

      - name: Verify flow sharing runtime
        run: |
          supabase status -o env | deno run --allow-env --allow-net supabase/dev/flow_share_runtime_smoke.ts

      - name: Stop Supabase local services
        if: always()
        run: supabase stop --no-backup || true

  lock-gate-required:
    name: LOCK-GATE required
    if: always()
    needs:
      - edge-functions
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete backend gate
        run: test "${{ needs.edge-functions.result }}" = "success"
