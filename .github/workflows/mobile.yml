name: Mobile

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  mobile-fast-suite:
    name: LOCK-GATE July 1 source integrity
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Establish source-integrity evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/july1-source-integrity"
          evidence_manifest="$RUNNER_TEMP/july1-source-integrity.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout exact parent and mobile gitlink
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pinned Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Verify exact July 1 recovery source authority before Pub
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$GITHUB_SHA" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-pre.json"

      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Verify Pub generated only platform metadata
        run: |
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-pre.json"

      - name: Analyze selected runtime
        working-directory: mobile
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee "$RESULTS_DIR/analyzer.log"

      - name: Reconcile generated metadata and verify exact source authority
        if: always()
        run: |
          set +e
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-post.json"
          mutation_status=$?
          set -e
          git -C mobile restore --worktree -- .flutter-plugins-dependencies
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$GITHUB_SHA" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check
          exit "$mutation_status"

      - name: Hash source-integrity evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive source-integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: july1-source-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  lock-gate-evaluator:
    name: LOCK-GATE evaluator contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact parent and mobile gitlink
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run evaluator simulations
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest tool.ci.test_lock_gate
          python3 -m unittest tool.ci.test_july1_runtime_gate
          python3 -m py_compile tool/ci/lock_gate.py tool/ci/test_lock_gate.py
          python3 -m py_compile \
            tool/ci/july1_runtime_gate.py \
            tool/ci/test_july1_runtime_gate.py
          python3 -m json.tool \
            ci/runtime-authority/july1-recovery.v1.json >/dev/null
          python3 -m json.tool \
            ci/superseded/locked-contracts.post-july1.242.json >/dev/null
          python3 -m json.tool \
            ci/superseded/quarantine-registry.post-july1.7.json >/dev/null

  release-pipeline-contracts:
    name: LOCK-GATE release pipeline contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact history and mobile gitlink
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pinned Flutter build authority
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Run complete build and served-artifact contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 mobile/scripts/web_release_pipeline_test.py
          python3 mobile/scripts/served_artifact_verifier_test.py
          python3 -m unittest tool.ci.test_reconstruction_registry
          python3 -m unittest tool.ci.test_release_pipeline_gate
          python3 tool/ci/release_pipeline_gate.py \
            --workflow .github/workflows/mobile.yml

      - name: Enforce append-only reconstruction authority
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base_ref" ]]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          python3 tool/ci/reconstruction_registry.py \
            --repo-root . \
            --base-git-ref "$base_ref"

      - name: Validate pipeline source and closed contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            mobile/scripts/web_release_pipeline.py \
            mobile/scripts/web_release_pipeline_test.py \
            mobile/scripts/served_artifact_verifier.py \
            mobile/scripts/served_artifact_verifier_test.py \
            tool/ci/reconstruction_registry.py \
            tool/ci/test_reconstruction_registry.py \
            tool/ci/release_pipeline_gate.py \
            tool/ci/test_release_pipeline_gate.py
          bash -n \
            mobile/scripts/build_web_release.sh \
            mobile/scripts/deploy_cloudflare_pages.sh
          python3 -m json.tool \
            mobile/config/web/staging.public.json >/dev/null
          python3 -m json.tool \
            mobile/config/web/production.public.json >/dev/null
          python3 -m json.tool \
            mobile/config/web/cloudflare-served-contract.v1.json >/dev/null
          python3 -m json.tool \
            mobile/config/web/environment-delta-contract.v1.json >/dev/null
          git diff --check
          git -C mobile diff --check

  locked-contract-vm:
    name: LOCK-GATE deterministic build-control behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Establish VM evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/lock-gate-vm"
          evidence_manifest="$RUNNER_TEMP/lock-gate-vm.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout exact parent and mobile gitlink
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pinned Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Record and verify pre-Pub identity
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$GITHUB_SHA" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-pre.json"

      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Verify Pub generated only platform metadata
        run: |
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-pre.json"

      - name: Run deterministic web-runtime configuration contracts
        working-directory: mobile
        run: |
          flutter test --no-pub --machine --concurrency=1 \
            test/core/web_runtime_config_guard_test.dart \
            > "$RESULTS_DIR/web-runtime-config-guard.jsonl"

      - name: Reconcile generated metadata and verify post-test identity
        if: always()
        run: |
          set +e
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-post.json"
          mutation_status=$?
          set -e
          git -C mobile restore --worktree -- .flutter-plugins-dependencies
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$GITHUB_SHA" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check
          exit "$mutation_status"

      - name: Hash VM evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-gate-vm-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  locked-contract-process:
    name: LOCK-GATE superseded authority accounting
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Establish process evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/lock-gate-process"
          evidence_manifest="$RUNNER_TEMP/lock-gate-process.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout exact parent and mobile gitlink
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify selected and superseded authority accounting
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$GITHUB_SHA" \
            --output "$RESULTS_DIR/authority-accounting.json"
          cp ci/runtime-authority/july1-recovery.v1.json "$RESULTS_DIR/"
          cp ci/superseded/locked-contracts.post-july1.242.json "$RESULTS_DIR/"
          cp ci/superseded/quarantine-registry.post-july1.7.json "$RESULTS_DIR/"

      - name: Record and verify post-accounting identity
        if: always()
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$GITHUB_SHA" \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check

      - name: Hash authority-accounting evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive authority-accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-gate-july1-authority-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  full-suite-quarantine-monitor:
    name: LOCK-GATE full July 1 runtime authority
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Establish full-suite evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/lock-gate-full"
          evidence_manifest="$RUNNER_TEMP/lock-gate-full.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout exact parent and mobile gitlink
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pinned Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Record and verify pre-Pub identity
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$GITHUB_SHA" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-pre.json"

      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Verify Pub generated only platform metadata
        run: |
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-pre.json"

      - name: Run and classify the complete exact July 1 inventory
        run: |
          set +e
          (
            cd mobile
            flutter test --no-pub --machine --concurrency=1
          ) > "$RESULTS_DIR/full-suite.jsonl" 2>&1
          flutter_status=$?
          set -e
          python3 tool/ci/july1_runtime_gate.py evaluate-full \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --machine-log "$RESULTS_DIR/full-suite.jsonl" \
            --flutter-status "$flutter_status" \
            --mobile-root mobile \
            --output-dir "$RESULTS_DIR/evaluation"

      - name: Reconcile generated metadata and verify post-test identity
        if: always()
        run: |
          set +e
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-post.json"
          mutation_status=$?
          set -e
          git -C mobile restore --worktree -- .flutter-plugins-dependencies
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$GITHUB_SHA" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check
          exit "$mutation_status"

      - name: Hash full-runtime evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive full-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-gate-july1-full-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  lock-gate-required:
    name: LOCK-GATE required
    if: always()
    needs:
      - mobile-fast-suite
      - lock-gate-evaluator
      - release-pipeline-contracts
      - locked-contract-vm
      - locked-contract-process
      - full-suite-quarantine-monitor
    runs-on: ubuntu-latest
    steps:
      - name: Require every July 1 runtime and build-control gate
        run: |
          test "${{ needs.mobile-fast-suite.result }}" = "success"
          test "${{ needs.lock-gate-evaluator.result }}" = "success"
          test "${{ needs.release-pipeline-contracts.result }}" = "success"
          test "${{ needs.locked-contract-vm.result }}" = "success"
          test "${{ needs.locked-contract-process.result }}" = "success"
          test "${{ needs.full-suite-quarantine-monitor.result }}" = "success"
