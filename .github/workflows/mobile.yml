name: Mobile

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  resolve-historical-pair:
    name: LOCK-GATE resolve frozen July 1 pair
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      parent: ${{ steps.resolve.outputs.parent }}
    steps:
      - name: Checkout candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve and verify the frozen July 1 recovery pair
        id: resolve
        run: |
          set -euo pipefail
          python3 tool/ci/forward_candidate_gate.py resolve-historical \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --historical-root "$RUNNER_TEMP/july1-historical" \
            --output "$RUNNER_TEMP/historical-pair.json"
          parent="$(python3 -c 'import json,pathlib; print(json.loads(pathlib.Path("'"$RUNNER_TEMP"'/historical-pair.json").read_text())["historicalParent"])')"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"

  mobile-fast-suite:
    name: LOCK-GATE July 1 source integrity
    needs:
      - resolve-historical-pair
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HISTORICAL_PARENT: ${{ needs.resolve-historical-pair.outputs.parent }}
    steps:
      - name: Establish source-integrity evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/july1-source-integrity"
          evidence_manifest="$RUNNER_TEMP/july1-source-integrity.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout frozen July 1 recovery pair
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-historical-pair.outputs.parent }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up pinned Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Verify exact July 1 recovery source authority before Pub
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$HISTORICAL_PARENT" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-pre.json"

      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Verify Pub generated only platform metadata
        run: |
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-pre.json"

      - name: Analyze selected runtime
        working-directory: mobile
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee "$RESULTS_DIR/analyzer.log"

      - name: Reconcile generated metadata and verify exact source authority
        if: always()
        run: |
          set +e
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-post.json"
          mutation_status=$?
          set -e
          git -C mobile restore --worktree -- .flutter-plugins-dependencies
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$HISTORICAL_PARENT" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check
          exit "$mutation_status"

      - name: Hash source-integrity evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive source-integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: july1-source-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  lock-gate-evaluator:
    name: LOCK-GATE evaluator contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact parent and mobile gitlink
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run evaluator simulations
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest tool.ci.test_lock_gate
          python3 -m unittest tool.ci.test_july1_runtime_gate
          python3 -m unittest tool.ci.test_forward_candidate_gate
          python3 -m py_compile tool/ci/lock_gate.py tool/ci/test_lock_gate.py
          python3 -m py_compile \
            tool/ci/july1_runtime_gate.py \
            tool/ci/test_july1_runtime_gate.py
          python3 -m py_compile \
            tool/ci/forward_candidate_gate.py \
            tool/ci/test_forward_candidate_gate.py
          python3 tool/ci/forward_candidate_gate.py validate-workflow \
            --workflow .github/workflows/mobile.yml
          python3 -m json.tool \
            ci/runtime-authority/july1-recovery.v1.json >/dev/null
          python3 -m json.tool \
            ci/superseded/locked-contracts.post-july1.242.json >/dev/null
          python3 -m json.tool \
            ci/superseded/quarantine-registry.post-july1.7.json >/dev/null

  release-pipeline-contracts:
    name: LOCK-GATE release pipeline contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact history and mobile gitlink
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pinned Flutter build authority
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Run complete build and served-artifact contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 mobile/scripts/web_release_pipeline_test.py
          python3 mobile/scripts/served_artifact_verifier_test.py
          python3 -m unittest tool.ci.test_reconstruction_registry
          python3 -m unittest tool.ci.test_release_pipeline_gate
          python3 tool/ci/release_pipeline_gate.py \
            --workflow .github/workflows/mobile.yml

      - name: Enforce append-only reconstruction authority
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base_ref" ]]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          python3 tool/ci/reconstruction_registry.py \
            --repo-root . \
            --base-git-ref "$base_ref"

      - name: Validate pipeline source and closed contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            mobile/scripts/web_release_pipeline.py \
            mobile/scripts/web_release_pipeline_test.py \
            mobile/scripts/served_artifact_verifier.py \
            mobile/scripts/served_artifact_verifier_test.py \
            tool/ci/reconstruction_registry.py \
            tool/ci/test_reconstruction_registry.py \
            tool/ci/release_pipeline_gate.py \
            tool/ci/test_release_pipeline_gate.py
          bash -n \
            mobile/scripts/build_web_release.sh \
            mobile/scripts/deploy_cloudflare_pages.sh
          python3 -m json.tool \
            mobile/config/web/staging.public.json >/dev/null
          python3 -m json.tool \
            mobile/config/web/production.public.json >/dev/null
          python3 -m json.tool \
            mobile/config/web/cloudflare-served-contract.v1.json >/dev/null
          python3 -m json.tool \
            mobile/config/web/environment-delta-contract.v1.json >/dev/null
          git diff --check
          git -C mobile diff --check

  locked-contract-vm:
    name: LOCK-GATE deterministic build-control behavior
    needs:
      - resolve-historical-pair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HISTORICAL_PARENT: ${{ needs.resolve-historical-pair.outputs.parent }}
    steps:
      - name: Establish VM evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/lock-gate-vm"
          evidence_manifest="$RUNNER_TEMP/lock-gate-vm.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout frozen July 1 recovery pair
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-historical-pair.outputs.parent }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up pinned Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Record and verify pre-Pub identity
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$HISTORICAL_PARENT" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-pre.json"

      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Verify Pub generated only platform metadata
        run: |
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-pre.json"

      - name: Run deterministic web-runtime configuration contracts
        working-directory: mobile
        run: |
          flutter test --no-pub --machine --concurrency=1 \
            test/core/web_runtime_config_guard_test.dart \
            > "$RESULTS_DIR/web-runtime-config-guard.jsonl"

      - name: Reconcile generated metadata and verify post-test identity
        if: always()
        run: |
          set +e
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-post.json"
          mutation_status=$?
          set -e
          git -C mobile restore --worktree -- .flutter-plugins-dependencies
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$HISTORICAL_PARENT" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check
          exit "$mutation_status"

      - name: Hash VM evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-gate-vm-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  locked-contract-process:
    name: LOCK-GATE superseded authority accounting
    needs:
      - resolve-historical-pair
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HISTORICAL_PARENT: ${{ needs.resolve-historical-pair.outputs.parent }}
    steps:
      - name: Establish process evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/lock-gate-process"
          evidence_manifest="$RUNNER_TEMP/lock-gate-process.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout frozen July 1 recovery pair
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-historical-pair.outputs.parent }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify selected and superseded authority accounting
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$HISTORICAL_PARENT" \
            --output "$RESULTS_DIR/authority-accounting.json"
          cp ci/runtime-authority/july1-recovery.v1.json "$RESULTS_DIR/"
          cp ci/superseded/locked-contracts.post-july1.242.json "$RESULTS_DIR/"
          cp ci/superseded/quarantine-registry.post-july1.7.json "$RESULTS_DIR/"

      - name: Record and verify post-accounting identity
        if: always()
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$HISTORICAL_PARENT" \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check

      - name: Hash authority-accounting evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive authority-accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-gate-july1-authority-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  full-suite-quarantine-monitor:
    name: LOCK-GATE full July 1 runtime authority
    needs:
      - resolve-historical-pair
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: America/Los_Angeles
      HISTORICAL_PARENT: ${{ needs.resolve-historical-pair.outputs.parent }}
    steps:
      - name: Establish full-suite evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/lock-gate-full"
          evidence_manifest="$RUNNER_TEMP/lock-gate-full.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout frozen July 1 recovery pair
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-historical-pair.outputs.parent }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up pinned Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Record and verify pre-Pub identity
        run: |
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$HISTORICAL_PARENT" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-pre.json"

      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Verify Pub generated only platform metadata
        run: |
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-pre.json"

      - name: Run and classify the complete exact July 1 inventory
        run: |
          set +e
          (
            cd mobile
            flutter test --no-pub --machine --concurrency=1
          ) > "$RESULTS_DIR/full-suite.jsonl" 2>&1
          flutter_status=$?
          set -e
          python3 tool/ci/july1_runtime_gate.py evaluate-full \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --machine-log "$RESULTS_DIR/full-suite.jsonl" \
            --flutter-status "$flutter_status" \
            --mobile-root mobile \
            --output-dir "$RESULTS_DIR/evaluation"

      - name: Reconcile generated metadata and verify post-test identity
        if: always()
        run: |
          set +e
          python3 tool/ci/july1_runtime_gate.py inspect-pub-get-mutation \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --mobile-root mobile \
            --output "$RESULTS_DIR/pub-generated-post.json"
          mutation_status=$?
          set -e
          git -C mobile restore --worktree -- .flutter-plugins-dependencies
          python3 tool/ci/july1_runtime_gate.py verify-checkout \
            --profile ci/runtime-authority/july1-recovery.v1.json \
            --parent-root . \
            --mobile-root mobile \
            --expected-parent "$HISTORICAL_PARENT" \
            --include-toolchain \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check
          exit "$mutation_status"

      - name: Hash full-runtime evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive full-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-gate-july1-full-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  forward-candidate-runtime:
    name: LOCK-GATE forward candidate runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Establish forward-runtime evidence paths
        id: results
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/forward-candidate-runtime"
          evidence_manifest="$RUNNER_TEMP/forward-candidate-runtime.sha256"
          mkdir -p "$results_dir"
          echo "RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          echo "EVIDENCE_MANIFEST=$evidence_manifest" >> "$GITHUB_ENV"
          echo "dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$evidence_manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout current candidate pair
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve declared base
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            declared="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            declared="${{ github.event.before }}"
          else
            git fetch origin main
            declared="$(git rev-parse origin/main)"
          fi
          if [[ ! "$declared" =~ ^[0-9a-f]{40}$ ]] || [[ "$declared" = "0000000000000000000000000000000000000000" ]]; then
            echo "declared_base is not a nonzero 40-hex SHA: ${declared:-empty}" >&2
            exit 1
          fi
          echo "sha=$declared" >> "$GITHUB_OUTPUT"

      - name: Verify declared-base forward provenance
        run: |
          python3 tool/ci/forward_candidate_gate.py verify-forward \
            --parent-root . \
            --mobile-root mobile \
            --declared-base "${{ steps.base.outputs.sha }}" \
            --output "$RESULTS_DIR/forward-pre.json"

      - name: Set up pinned Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Install locked current-candidate dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Materialize declared base pair
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/declared-base" \
            "${{ steps.base.outputs.sha }}"
          git -C "$RUNNER_TEMP/declared-base" submodule update --init --recursive

      - name: Install locked declared-base dependencies
        working-directory: ${{ runner.temp }}/declared-base/mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze declared base and current candidate
        run: |
          set -euo pipefail
          set +e
          (
            cd "$RUNNER_TEMP/declared-base/mobile"
            flutter analyze --no-fatal-infos --machine
          ) > "$RESULTS_DIR/analyzer-base.json" 2>"$RESULTS_DIR/analyzer-base.stderr"
          base_status=$?
          (
            cd mobile
            flutter analyze --no-fatal-infos --machine
          ) > "$RESULTS_DIR/analyzer-candidate.json" 2>"$RESULTS_DIR/analyzer-candidate.stderr"
          candidate_status=$?
          set -e
          python3 tool/ci/forward_candidate_gate.py compare-analyze \
            --base-log "$RESULTS_DIR/analyzer-base.json" \
            --candidate-log "$RESULTS_DIR/analyzer-candidate.json" \
            --base-mobile-root "$RUNNER_TEMP/declared-base/mobile" \
            --candidate-mobile-root mobile \
            --base-status "$base_status" \
            --candidate-status "$candidate_status" \
            --output "$RESULTS_DIR/analyzer-compare.json"

      - name: Test declared base and current candidate
        run: |
          set +e
          (
            cd "$RUNNER_TEMP/declared-base/mobile"
            flutter test --no-pub --machine --concurrency=1
          ) > "$RESULTS_DIR/tests-base.jsonl" 2>"$RESULTS_DIR/tests-base.stderr"
          base_status=$?
          (
            cd mobile
            flutter test --no-pub --machine --concurrency=1
          ) > "$RESULTS_DIR/tests-candidate.jsonl" 2>"$RESULTS_DIR/tests-candidate.stderr"
          candidate_status=$?
          set -e
          python3 tool/ci/forward_candidate_gate.py compare-test \
            --base-log "$RESULTS_DIR/tests-base.jsonl" \
            --candidate-log "$RESULTS_DIR/tests-candidate.jsonl" \
            --base-mobile-root "$RUNNER_TEMP/declared-base/mobile" \
            --candidate-mobile-root mobile \
            --base-parent-root "$RUNNER_TEMP/declared-base" \
            --candidate-parent-root . \
            --base-status "$base_status" \
            --candidate-status "$candidate_status" \
            --output "$RESULTS_DIR/tests-compare.json"

      - name: Restore generated metadata and verify clean post-test identity
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/declared-base/mobile" ]; then
            git -C "$RUNNER_TEMP/declared-base/mobile" restore --worktree -- .flutter-plugins-dependencies
          fi
          git -C mobile restore --worktree -- .flutter-plugins-dependencies
          python3 tool/ci/forward_candidate_gate.py verify-worktree-clean \
            --parent-root . \
            --mobile-root mobile \
            --output "$RESULTS_DIR/identity-post.json"
          git diff --check
          git -C mobile diff --check

      - name: Hash forward-runtime evidence
        if: always()
        run: |
          python3 tool/ci/lock_gate.py hash-results \
            --root "$RESULTS_DIR" \
            --output "$EVIDENCE_MANIFEST"

      - name: Archive forward-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-gate-forward-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.results.outputs.dir }}
            ${{ steps.results.outputs.manifest }}

  lock-gate-required:
    name: LOCK-GATE required
    if: always()
    needs:
      - resolve-historical-pair
      - mobile-fast-suite
      - lock-gate-evaluator
      - release-pipeline-contracts
      - locked-contract-vm
      - locked-contract-process
      - full-suite-quarantine-monitor
